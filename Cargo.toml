# Cargo workspace for the Rust components of Goblin Mode Pro.
#
# It holds one crate today - the privileged helper - and is a workspace anyway
# because the conversion plan adds gmp-core, gmp-daemon, gmp-cli, gmp-ipc and
# gmp-gui to it later, and retrofitting a workspace around a standalone crate
# is annoying in a way that creating one now is not.
#
# The Python implementation is NOT going anywhere while this is built: the
# helper, daemon and GUI meet only over D-Bus, so each can be in either
# language independently. docs/dbus-interface-v1.xml is what makes that safe.
[workspace]
resolver = "2"
members = ["crates/gmp-cli", "crates/gmp-core", "crates/gmp-helper"]

[workspace.package]
# Never published to crates.io: these crates ship inside the distro packages,
# and gmp-helper is a privileged binary that should not be installable by
# `cargo install` from a registry. Saying so also lets the sibling path
# dependencies stay unversioned - see deny.toml.
publish = false
version = "1.5.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Bvaughan7/goblin-mode-pro"
authors = ["Bryan Vaughan <bryanvaughan07@gmail.com>"]

[workspace.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the LLM payload is text a user pastes somewhere, so its
# key order has to match the Python's insertion order rather than being
# sorted. Without this the two implementations produce different bytes
# for the same incident.
serde_json = { version = "1", features = ["preserve_order"] }
# pidfd_open / pidfd_send_signal / setpriority, without writing unsafe. The
# crate forbids unsafe_code, so raw syscalls are not an option, and Renice
# needs all three to pin a pid against reuse.
# gmp-core: the log rules are regex-driven. No backreferences or
# lookaround anywhere in the rule base, so the regex crate covers it.
regex = "1"
rustix = { version = "1", features = ["process"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
