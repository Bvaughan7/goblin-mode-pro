# Drop-in applied by install.sh ONLY when `ryzenadj` is installed, so the
# hardened base unit stays as tight as possible for everyone else.
#
# ryzenadj talks to the APU's SMU: on recent systems through the `ryzen_smu`
# kernel module's sysfs interface, otherwise via raw PCI / /dev/mem. Both need
# more than the base unit allows, so this loosens exactly those bits.
#
# If AMD TDP control still fails after this, install the `ryzen_smu-dkms`
# module (AUR / COPR) and reboot.

[Service]
CapabilityBoundingSet=CAP_SYS_NICE CAP_SYS_RAWIO
AmbientCapabilities=CAP_SYS_RAWIO
PrivateDevices=no
DeviceAllow=/dev/mem rw
DeviceAllow=char-mem rw
ReadWritePaths=/sys/kernel/ryzen_smu_drv /dev/mem
# SystemCallFilter is an ALLOWLIST: the base unit's `~@raw-io` only removes a
# group from the deny list, it does not add it back to the allowlist, and
# @system-service does not contain @raw-io. ryzenadj's /dev/mem mmap path is
# plain open()+mmap() (already in @system-service), but its PCI port-IO
# fallback - taken when the ryzen_smu module isn't loaded - needs iopl/ioperm.
# So @raw-io has to be granted explicitly here.
SystemCallFilter=
SystemCallFilter=@system-service @raw-io
SystemCallFilter=~@obsolete @cpu-emulation @debug @mount @swap @reboot @module
