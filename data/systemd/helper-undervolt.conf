# Drop-in applied by install.sh ONLY when `intel-undervolt` is installed.
#
# intel-undervolt writes model-specific MSRs, which needs raw hardware access
# the hardened base unit denies. This loosens exactly that. Goblin Mode Pro
# never chooses the offsets - it only re-runs `intel-undervolt apply` so the
# offsets you configured in /etc/intel-undervolt.conf survive suspend / thermald.

[Service]
CapabilityBoundingSet=CAP_SYS_NICE CAP_SYS_RAWIO
AmbientCapabilities=CAP_SYS_RAWIO
PrivateDevices=no
DeviceAllow=/dev/cpu/*/msr rw
DeviceAllow=char-cpu/msr rw
ProtectKernelModules=no
SystemCallFilter=
SystemCallFilter=@system-service
SystemCallFilter=~@obsolete @cpu-emulation @debug @mount @swap @reboot
