<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name and run the service. -->
  <policy user="root">
    <allow own="com.goblinmode.ProHelper"/>
    <allow send_destination="com.goblinmode.ProHelper"/>
  </policy>

  <!-- Any local user may *call* the manager; every mutating method is then
       authorised through polkit inside the helper before it acts. Nothing else
       on the destination is reachable. -->
  <policy context="default">
    <deny send_destination="com.goblinmode.ProHelper"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="com.goblinmode.ProHelper.Manager"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
