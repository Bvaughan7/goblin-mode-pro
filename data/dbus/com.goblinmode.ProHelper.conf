<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the helper name. -->
  <policy user="root">
    <allow own="com.goblinmode.ProHelper"/>
    <allow send_destination="com.goblinmode.ProHelper"/>
  </policy>

  <!-- Any local user may talk to it; each mutating call is still gated by
       polkit inside the helper. -->
  <policy context="default">
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="com.goblinmode.ProHelper.Manager"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.goblinmode.ProHelper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
