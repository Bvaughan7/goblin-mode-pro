<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="plate" cx="30%" cy="18%" r="120%">
      <stop offset="0%" stop-color="#243016"/>
      <stop offset="100%" stop-color="#141c0d"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#92d15f"/>
      <stop offset="55%" stop-color="#5f9c37"/>
      <stop offset="100%" stop-color="#3d6a20"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4147"/>
      <stop offset="100%" stop-color="#21232a"/>
    </linearGradient>
    <style>
      .ink  { stroke:#171105; stroke-width:7;   stroke-linejoin:round; stroke-linecap:round; }
      .ink5 { stroke:#171105; stroke-width:5;   stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#plate)"/>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="none" stroke="#0c1207" stroke-width="4"/>
  <g transform="translate(128 132) scale(0.8) translate(-128 -128)">
  <g transform="rotate(-3 128 130)">
    <!-- ears -->
    <path class="ink" fill="url(#skin)" d="M86 128 C50 126 24 108 10 68 C8 58 15 52 25 55 C64 68 92 96 102 126 Z"/>
    <path class="ink" fill="url(#skin)" d="M170 126 C206 124 232 106 246 66 C248 56 241 50 231 53 C192 66 164 94 154 124 Z"/>
    <path fill="#3d6a20" d="M82 116 C58 108 40 92 30 68 C56 84 74 100 90 124 Z"/>
    <path fill="#3d6a20" d="M174 114 C198 106 214 92 224 68 C198 82 182 98 166 120 Z"/>

    <!-- head -->
