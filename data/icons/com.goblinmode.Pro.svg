      C177 42 207 73 209 118
      C210 150 199 179 178 199
      C162 215 146 223 128 223
      C110 223 94 215 78 199
      C57 179 46 150 47 118
      C49 73 79 42 128 42 Z"/>
    <path fill="#3d6a20" opacity="0.5" d="M128 223 C146 223 162 215 178 199 C199 179 210 150 209 118 C207 153 193 187 170 205 C154 217 140 221 128 223 Z"/>
    <path fill="#a9db76" opacity="0.55" d="M94 60 C114 46 148 46 166 58 C142 54 116 58 98 76 Z"/>

    <!-- brows: two matched angry wedges, no bridge -->
    <path class="ink5" fill="#3d6a20" d="M70 120 C82 107 102 107 116 115 C105 120 92 119 82 120 C76 121 72 123 68 127 Z"/>
    <path class="ink5" fill="#3d6a20" d="M186 116 C174 103 154 103 140 111 C151 116 164 115 174 116 C180 117 184 119 188 123 Z"/>

    <!-- eyes: round, wide-set, goblin-gold, looking ahead -->
    <circle class="ink5" cx="97" cy="134" r="17" fill="#f2ecd6"/>
    <circle class="ink5" cx="159" cy="131" r="17" fill="#f2ecd6"/>
    <circle cx="98" cy="135" r="10.5" fill="#e8a92c"/>
    <circle cx="158" cy="132" r="10.5" fill="#e8a92c"/>
    <circle cx="99" cy="135" r="5" fill="#171105"/>
    <circle cx="157" cy="132" r="5" fill="#171105"/>
    <circle cx="95" cy="131" r="2.6" fill="#fff"/>
    <circle cx="153" cy="128" r="2.6" fill="#fff"/>

    <!-- nose -->
    <path class="ink" fill="url(#skin)" d="M128 122 C137 126 145 140 146 154 C146 166 138 172 126 170 C117 168 112 159 114 149 C116 135 120 122 128 122 Z"/>
    <ellipse cx="122" cy="159" rx="3.7" ry="5.4" fill="#201810"/>
    <ellipse cx="134" cy="158" rx="3.7" ry="5.4" fill="#201810"/>

    <!-- grin -->
    <path class="ink" fill="#3a1f1c" d="M88 178 C106 174 118 178 128 180 C140 182 154 180 170 174 C168 202 149 217 126 215 C99 213 86 197 88 178 Z"/>
    <path fill="#f2ecd6" stroke="#171105" stroke-width="4" stroke-linejoin="round"
      d="M94 180 L104 195 L115 181 L127 196 L139 181 L150 194 L162 178
         C160 188 154 193 145 193 L105 193 C97 192 94 187 94 180 Z"/>
    <path class="ink5" fill="#f2ecd6" d="M139 180 C137 168 140 158 147 156 C154 162 154 176 149 184 C145 186 141 185 139 180 Z"/>

    <!-- warts -->
    <circle cx="62" cy="150" r="5" fill="#3d6a20"/>
    <circle cx="196" cy="146" r="4.5" fill="#3d6a20"/>
    <circle cx="128" cy="205" r="4.5" fill="#3d6a20"/>

    <!-- ================= gaming headset ================= -->
    <path d="M60 92 C78 48 178 48 196 92" fill="none" stroke="#171105" stroke-width="21" stroke-linecap="round"/>
    <path d="M60 92 C78 53 178 53 196 92" fill="none" stroke="#34383e" stroke-width="12" stroke-linecap="round"/>
    <path d="M66 74 C92 58 164 58 190 74" fill="none" stroke="#4c5057" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- left ear cup -->
    <rect class="ink" x="28" y="102" width="46" height="60" rx="19" fill="url(#cup)"/>
    <rect x="39" y="113" width="24" height="38" rx="11" fill="#4c5057"/>
    <circle cx="51" cy="132" r="4" fill="#e8a92c"/>

    <!-- right ear cup -->
    <rect class="ink" x="182" y="98" width="46" height="60" rx="19" fill="url(#cup)"/>
    <rect x="193" y="109" width="24" height="38" rx="11" fill="#4c5057"/>
    <circle cx="205" cy="128" r="4" fill="#e8a92c"/>

    <!-- boom mic to the corner of the mouth -->
    <path d="M36 156 C28 186 40 206 74 200" fill="none" stroke="#171105" stroke-width="13" stroke-linecap="round"/>
    <path d="M36 156 C28 186 40 204 74 198" fill="none" stroke="#34383e" stroke-width="6" stroke-linecap="round"/>
    <circle class="ink5" cx="80" cy="196" r="11" fill="#e8a92c"/>
  </g>
  </g>
</svg>
