[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-mode-pro"
dynamic = ["version"]
description = "Native Linux gaming performance and diagnostics utility"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bryan Vaughan", email = "bryanvaughan07@gmail.com" }]
keywords = ["linux-gaming", "proton", "gamemode", "mangohud", "gtk4", "wayland"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Monitoring",
]

# On Arch-based distributions these come from pacman, not pip
# (python-gobject python-psutil python-pillow python-pystray gtk4 libadwaita).
# They are declared here for non-Arch installs and for tooling.
dependencies = [
    "psutil>=5.9",
    "pystray>=0.19",
    "Pillow>=10",
    "PyGObject>=3.46",
]

[project.optional-dependencies]
# The suite itself is stdlib-only (`python -m unittest discover -s tests`);
# pytest is optional and just gives nicer output / selection.
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Bvaughan7/goblin-mode-pro"
Source = "https://github.com/Bvaughan7/goblin-mode-pro"
Issues = "https://github.com/Bvaughan7/goblin-mode-pro/issues"

[project.scripts]
goblin-mode-pro-daemon = "goblinmode.daemon:main"
goblin-mode-pro = "goblinmode.gui.app:main"
goblin-mode-pro-cli = "goblinmode.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
goblinmode = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "goblinmode.__about__.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Runs in CI as `ruff check` - never `ruff format`. It must not reformat
# existing files; every rule here is one that finds a defect or a genuine
# simplification, not a style preference.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F     pyflakes - unused imports/vars, undefined names, f-string mistakes
# E7/E9 pycodestyle statement + runtime errors (ambiguous names, bare except)
# B     bugbear - real bug shapes (mutable defaults, zip() without strict=)
# SIM   simplifications with no behaviour change
# UP    pyupgrade, against target-version
# RUF   ruff's own checks (mutable class attrs, unnecessary casts)
# BLE   blind except. The codebase already documents every intentional one
#       with `# noqa: BLE001`, so enabling this makes those markers mean
#       something and flags the next broad except that isn't deliberate.
select = ["F", "E7", "E9", "B", "SIM", "UP", "RUF", "BLE"]

# Codes that appear in `# noqa` markers in the tree but are not selected above.
# Listing them here stops RUF100 reporting those markers as dead while leaving
# it free to catch genuinely dead ones. They document decisions worth keeping:
# N802 on the GObject vfuncs that must be named do_activate/do_startup, and
# S310/S606 on the deliberate urllib/subprocess calls.
external = ["N802", "S310", "S606"]

# Three rules are dropped as noise on this codebase rather than papered over
# with per-line noqa:
#   E501  line length. Enforcing it now would reformat files wholesale, which
#         is exactly what this config is not for. line-length above still
#         documents the intent.
#   E402  module import not at top. Structural here: `gi.require_version()`
#         has to run before `from gi.repository import ...`, so every GTK
#         module in the tree legitimately trips it.
#   RUF001 ambiguous unicode in strings. The user-facing text deliberately
#         uses em dashes and µW; flagging them is a false positive.
ignore = ["E501", "E402", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The fake helper is written as compact one-line stubs on purpose - it is a
# table of call recordings, and splitting each into three lines makes it
# harder to read, not easier.
"tests/test_payload.py" = ["E702"]
