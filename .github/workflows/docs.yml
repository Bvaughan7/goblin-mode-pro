name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "web/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build
      - name: Deploy custom showcase website to site root
        run: |
          mkdir -p site/docs-home
          cp site/index.html site/docs-home/index.html
          cp web/index.html site/index.html
          mkdir -p site/assets
          cp -r web/assets/* site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
