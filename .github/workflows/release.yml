name: Release packages

# Builds the .deb and .rpm described in packaging/README.md and attaches them
# to the GitHub Release. Triggered by publishing a release, or manually (as a
# workflow_dispatch smoke test - artifacts are uploaded either way, only the
# "publish" job needs an actual release to attach to).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          v=$(python3 -c "import re; print(re.search(r'\"([^\"]+)\"', open('src/goblinmode/__about__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "building packages for v$v"

  deb:
    needs: version
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev fakeroot build-essential

      # The goblin-mode-pro-helper-rust package is compiled, so this job needs
      # a toolchain. Deliberately rustup rather than apt: Ubuntu's rustc lags
      # behind the workspace's rust-version, and pinning the packaging to
      # whatever the runner image happens to ship is how a release starts
      # failing for reasons nobody changed.
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the .deb
        run: |
          cp -r packaging/debian .   # dpkg-buildpackage expects ./debian
          # -d skips the build-dependency check: cargo and rustc come from
          # rustup above rather than from apt, so dpkg cannot see them. These
          # are CI-built binary packages, not Debian-archive submissions - see
          # packaging/README.md.
          dpkg-buildpackage -us -uc -b -d
          mkdir -p dist
          mv ../goblin-mode-pro*.deb dist/

      # Signs with the maintainer's own key, added as repo secrets - see
      # CONTRIBUTING.md "Signing releases". Skips cleanly (unsigned artifact,
      # same as today) when the secrets aren't set, e.g. on a fork's CI.
      - name: Sign the .deb
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          sudo apt-get install -y dpkg-sig
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          for f in dist/*.deb; do
            dpkg-sig --gpg-options "--batch --passphrase $GPG_PASSPHRASE --pinentry-mode loopback" \
              -k "$key_id" --sign builder "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Install packaging tools
        run: dnf install -y rpm-build rpm-sign systemd-rpm-macros gnupg2 git python3 tar gzip cargo rust

      # actions/checkout doesn't work inside every container image, and we
      # only need a plain source tree here - git clone it ourselves.
      - name: Checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            "https://github.com/${GITHUB_REPOSITORY}.git" src-checkout || \
          git clone --depth 50 "https://github.com/${GITHUB_REPOSITORY}.git" src-checkout
          cd src-checkout && git checkout "${GITHUB_SHA}"

      - name: Build the .rpm
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          cd src-checkout
          git archive --prefix="goblin-mode-pro-${VERSION}/" \
            -o "../rpmbuild/SOURCES/goblin-mode-pro-${VERSION}.tar.gz" HEAD
          cd ..
          rpmbuild -bb src-checkout/packaging/rpm/goblin-mode-pro.spec \
            --define "_topdir $PWD/rpmbuild"
          mkdir -p dist
          find rpmbuild/RPMS -name '*.rpm' -exec mv {} dist/ \;

      # Same key/secrets as the .deb job - see CONTRIBUTING.md "Signing
      # releases". Skips cleanly when the secrets aren't set.
      - name: Sign the .rpm
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          name=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          cat > ~/.rpmmacros <<MACROS
          %_signature gpg
          %_gpg_name $name
          MACROS
          for f in dist/*.rpm; do
            rpmsign --addsign --define "_gpg_pass $GPG_PASSPHRASE" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  publish:
    if: github.event_name == 'release'
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
