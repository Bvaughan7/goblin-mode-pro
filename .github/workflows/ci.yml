name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the runner's system python3 (like gui-import) so the apt-installed
      # PyGObject is importable. The suite is stdlib-only except for psutil
      # (diagnostics / observer / gamedetect) and PyGObject, which the payload
      # and bridge integration tests pull in via the D-Bus client layer.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-psutil python3-gi gir1.2-glib-2.0 python3-cairo

      - name: Compile-check every module
        run: python3 -m compileall -q src helper

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n packaging/aur/PKGBUILD
          bash -n packaging/aur/goblin-mode-pro.install

      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # install scripts: definite-bug level only (they're not verified
          # against every shellcheck style rule yet)
          shellcheck --severity=error install.sh
          shellcheck --severity=error -s bash packaging/aur/goblin-mode-pro.install
          # the generated wrapper runs in front of every game launch - lint it
          # properly (warning level), it was never checked before
          python3 -c "import sys; sys.path.insert(0,'src'); \
            from goblinmode.runner import _WRAPPER_TEMPLATE; \
            open('/tmp/goblin-run','w').write(_WRAPPER_TEMPLATE)"
          shellcheck --severity=warning /tmp/goblin-run

      - name: ruff
        # Everything Python in the tree, not just src/helper/tests - scripts/
        # and docs/ were outside the old scope, which is how an unused import
        # sat in scripts/make-demo.py without CI noticing.
        run: pipx run ruff check .

      - name: Validate the community profile JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          idx = json.loads(pathlib.Path("profiles/index.json").read_text())
          assert isinstance(idx, list) and idx, "index.json must be a non-empty list"
          for entry in idx:
              slug = entry["slug"]
              data = json.loads(pathlib.Path(f"profiles/{slug}.json").read_text())
              assert data.get("exe"), f"{slug}.json has no exe"
          print(f"{len(idx)} community profiles OK")
          PY

  gui-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-psutil
      - name: Import every GUI module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          sys.path.insert(0, "src")
          import goblinmode.gui as gui
          for m in pkgutil.walk_packages(gui.__path__, "goblinmode.gui."):
              importlib.import_module(m.name)
              print("imported", m.name)
          PY

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita + a headless X server and session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-psutil xvfb dbus-x11
      - name: Construct MainWindow under Xvfb (tests/gui_smoke.py)
        run: xvfb-run -a dbus-run-session -- python3 tests/gui_smoke.py

  # This job is the reason mixed Python/Rust installs are safe. The helper,
  # the daemon and the GUI are three processes that only ever meet over D-Bus,
  # so each one can be in either language - but ONLY for as long as every
  # implementation serves byte-identical interfaces. If this job fails, the
  # contract moved. Fix the implementation or cut a v2 and update all of them.
  # Regenerating docs/dbus-interface-v1.xml to make it green is how a mixed
  # install silently breaks on somebody else's machine.
  interface-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyGObject (the helper imports Gio at module scope)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0

      - uses: dtolnay/rust-toolchain@stable

      # Built here so the freeze test can grade BOTH implementations against
      # the same frozen file, using the one canonicalizer in tests/_dbusxml.py.
      # Without the binary present that check skips itself, so
      # GMP_REQUIRE_RUST_HELPER turns the skip into a failure - a check that
      # can only ever skip is a check that has quietly stopped existing.
      - name: Build the Rust helper
        run: cargo build

      - name: Both helpers still serve the frozen v1 interface
        env:
          GMP_REQUIRE_RUST_HELPER: "1"
        run: python3 -m unittest tests.test_dbus_interface_freeze -v

      # The second seam: GUI/CLI to daemon. Same canonicalizer, same rules,
      # and now two implementations to grade rather than one - `cargo build`
      # above produces the Rust daemon, and GMP_REQUIRE_RUST_HELPER turns a
      # missing binary into a failure instead of a silent skip.
      - name: Both daemons still serve the frozen v1 interface
        env:
          GMP_REQUIRE_RUST_HELPER: "1"
        run: python3 -m unittest tests.test_daemon_interface_freeze -v

      - name: The conformance suite is runnable
        # It needs a live system bus and a polkit agent, so CI cannot execute
        # it - but a syntax error or a bad import in the suite would not be
        # discovered until somebody tried to verify real hardware with it.
        run: |
          python3 -m compileall -q tests/conformance
          python3 tests/conformance/helper.py --help > /dev/null

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The parity tests below import the Python modules they are diffing
      # against. Most of gmp-core's targets are pure stdlib, but gamedetect
      # imports psutil at module scope - so this job needs it too. Assuming
      # the pure-stdlib property would hold for every module is what broke
      # this job the first time.
      - name: Install what the parity tests import
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-psutil

      - name: Formatting
        run: cargo fmt --check

      # -D warnings from the first commit. The helper is small enough that
      # keeping it warning-free costs nothing now and is unpleasant to
      # retrofit later.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The domain-logic port is only safe while both implementations answer
      # the same way, so the Python side is asked the same questions and the
      # answers are diffed. `logrules` imports nothing but the standard
      # library, so this needs no PyGObject and belongs here with the
      # toolchain rather than in the Python job.
      - name: Rust and Python agree, module by module
        env:
          GMP_REQUIRE_RUST_HELPER: "1"
        run: |
          # The generated tables must still match the Python they came from.
          python3 tools/gen_config_tables.py | diff - crates/gmp-core/src/config_tables.rs
          cargo build -p gmp-core --examples
          cargo build -p gmp-cli --examples
          python3 -m unittest tests.test_logrules_parity \
                                tests.test_incidents_parity \
                                tests.test_sessions_parity \
                                tests.test_gpu_parity \
                                tests.test_gamedetect_parity \
                                tests.test_capabilities_parity \
                                tests.test_preflight_parity \
                                tests.test_scx_parity \
                                tests.test_compositor_parity \
                                tests.test_diagnostics_parity \
                                tests.test_fpswatch_parity \
                                tests.test_config_parity \
                                tests.test_selftest_report_parity \
                                tests.test_runner_parity \
                                tests.test_observer_parity \
                                tests.test_applied_parity \
                                tests.test_cli_report_parity \
                                tests.test_report_parity \
                                tests.test_status_parity -v

      # Advisories, licences and dependency sources. See deny.toml for why
      # this runs before the tree is big.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  state-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyGObject (the helper imports Gio at module scope)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0

      - uses: dtolnay/rust-toolchain@stable

      # The three files under /run/goblin-mode-pro are read and written by both
      # helper implementations, so either may find one the other wrote - which
      # is exactly what a rollback depends on. The fixtures in tests/fixtures/
      # were captured from the real writers; these two runs read every one of
      # them with both readers.
      - name: Python reads what Rust wrote
        run: python3 -m unittest tests.test_state_compat -v

      # cargo test takes a single filter, and the compat tests live in two
      # modules, so this runs the lot. It is a few seconds and it means the
      # job fails on its own terms rather than depending on `rust` passing.
      - name: Rust reads what Python wrote
        run: cargo test --workspace
