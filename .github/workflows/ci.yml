name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the runner's system python3 (like gui-import) so the apt-installed
      # PyGObject is importable. The suite is stdlib-only except for psutil
      # (diagnostics / observer / gamedetect) and PyGObject, which the payload
      # and bridge integration tests pull in via the D-Bus client layer.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-psutil python3-gi gir1.2-glib-2.0

      - name: Compile-check every module
        run: python3 -m compileall -q src helper

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n packaging/aur/PKGBUILD
          bash -n packaging/aur/goblin-mode-pro.install

      - name: Validate the community profile JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          idx = json.loads(pathlib.Path("profiles/index.json").read_text())
          assert isinstance(idx, list) and idx, "index.json must be a non-empty list"
          for entry in idx:
              slug = entry["slug"]
              data = json.loads(pathlib.Path(f"profiles/{slug}.json").read_text())
              assert data.get("exe"), f"{slug}.json has no exe"
          print(f"{len(idx)} community profiles OK")
          PY

  gui-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-psutil
      - name: Import every GUI module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          sys.path.insert(0, "src")
          import goblinmode.gui as gui
          for m in pkgutil.walk_packages(gui.__path__, "goblinmode.gui."):
              importlib.import_module(m.name)
              print("imported", m.name)
          PY

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita + a headless X server and session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-psutil xvfb dbus-x11
      - name: Construct MainWindow under Xvfb (tests/gui_smoke.py)
        run: xvfb-run -a dbus-run-session -- python3 tests/gui_smoke.py
